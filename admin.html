<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | My Business</title><link rel="stylesheet" href="style.css"><style>body{background:#f5f7fb}.admin{max-width:1150px;margin:40px auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card,.panel{background:#fff;border:1px solid #e7eaf0;border-radius:16px;padding:20px;box-shadow:0 8px 25px rgba(15,23,42,.05)}.card span{color:#667085;font-size:13px}.card strong{display:block;font-size:28px;margin-top:8px}.panel{margin-top:20px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px;border-bottom:1px solid #eee}.badge{padding:5px 9px;border-radius:20px;background:#eef4ff;color:#175cd3;font-size:12px;font-weight:700}.error{color:#b42318;background:#fff3f2;padding:12px;border-radius:10px}.muted{color:#667085}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.table{display:block;overflow:auto;white-space:nowrap}}@media(max-width:480px){.cards{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="admin"><div class="top"><div><p class="muted">MY BUSINESS · ADMIN</p><h1>Admin Dashboard</h1><p class="muted">Manage customer orders and monitor your business.</p></div><button class="btn btn-logout" id="logout">Logout</button></div><section class="cards"><div class="card"><span>Total Orders</span><strong id="total">0</strong></div><div class="card"><span>Pending</span><strong id="pending">0</strong></div><div class="card"><span>In Progress</span><strong id="progress">0</strong></div><div class="card"><span>Completed</span><strong id="completed">0</strong></div></section><section class="panel"><h2>Recent Orders</h2><div id="message" class="muted">Loading...</div><div id="table"></div></section></main><script type="module">import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";const supabase=createClient("https://yefjfcrevavskvxzkkub.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmF0ZSIsInJlZiI6InllZmpmY3JldmF2c2t2eHpra3ViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NzUxMjcsImV4cCI6MjA5OTM1MTEyN30.w7n3wBB4rEbq8Cg2RpOlg-bNnLjwrGIuWajAfLhUE");const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){const{data:{session}}=await supabase.auth.getSession();if(!session){location.href='login.html';return}const{data,error}=await supabase.from('orders').select('id,user_id,name,email,business_name,logo_style,price,status,created_at').order('created_at',{ascending:false}).limit(100);if(error){document.getElementById('message').innerHTML='<div class="error">Orders could not be loaded. Admin RLS policies must be configured before this page can securely list all customer orders.</div>';return}const rows=data||[];document.getElementById('total').textContent=rows.length;document.getElementById('pending').textContent=rows.filter(x=>x.status==='Pending').length;document.getElementById('progress').textContent=rows.filter(x=>['In Progress','Working','Active'].includes(x.status)).length;document.getElementById('completed').textContent=rows.filter(x=>x.status==='Completed').length;document.getElementById('message').textContent=rows.length?'':'No orders found.';document.getElementById('table').innerHTML=rows.length?`<table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Business</th><th>Price</th><th>Status</th><th>Date</th></tr></thead><tbody>${rows.map(o=>`<tr><td>#${esc(String(o.id).slice(0,8))}</td><td>${esc(o.name||o.email||'Customer')}</td><td>${esc(o.business_name||'—')}</td><td>₹${Number(o.price||0).toLocaleString('en-IN')}</td><td><span class="badge">${esc(o.status||'Pending')}</span></td><td>${o.created_at?new Date(o.created_at).toLocaleDateString('en-IN'):''}</td></tr>`).join('')}</tbody></table>`:''}document.getElementById('logout').onclick=async()=>{await supabase.auth.signOut();location.href='index.html'};init();</script></body></html>
