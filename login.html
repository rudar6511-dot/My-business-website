<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://yefjfcrevavskvxzkkub.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InllZmpmY3JldmF2c2t2eHpra3ViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NzUxMjcsImV4cCI6MjA5OTM1MTEyN30.w7n3wBB4rEbq8Cg2RpOlg-bNnLjwrGQ2c0h0Ng3d1aI"
);

window.login = async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const loginBtn = document.getElementById("login-btn");

  if (!email || !password) {
    alert("Please enter email and password");
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "Logging in...";

  try {
    const { data, error } = await supabase.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {
      alert("Login failed: " + error.message);
    } else {
      alert("✅ Login successful!");
      window.location.href = "dashboard.html";
    }
  } catch (err) {
    alert("Error: " + err.message);
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = "Login";
  }
};

window.addEventListener('load', async () => {
  const { data } = await supabase.auth.getSession();
  if (data.session) {
    window.location.href = "dashboard.html";
  }
});
</script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #0077ff 0%, #00d4ff 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

.container {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
}

.box {
  background: white;
  padding: 40px;
  width: 100%;
  max-width: 400px;
  border-radius: 15px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  animation: slideIn 0.3s ease-out;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(-20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.box h2 {
  text-align: center;
  color: #333;
  margin-bottom: 10px;
  font-size: 28px;
}

.box p {
  text-align: center;
  color: #666;
  margin-bottom: 30px;
  font-size: 14px;
}

.form-group {
  margin-bottom: 20px;
}

label {
  display: block;
  color: #333;
  font-weight: 600;
  margin-bottom: 8px;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 12px 15px;
  border: 2px solid #e0e0e0;
  border-radius: 8px;
  font-size: 16px;
  transition: all 0.3s ease;
  font-family: inherit;
}

input:focus {
  outline: none;
  border-color: #0077ff;
  box-shadow: 0 0 0 3px rgba(0, 119, 255, 0.1);
}

input:hover {
  border-color: #0077ff;
}

button {
  width: 100%;
  padding: 12px;
  background: #0077ff;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-top: 10px;
}

button:hover:not(:disabled) {
  background: #0056cc;
  transform: translateY(-2px);
  box-shadow: 0 10px 20px rgba(0, 119, 255, 0.3);
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.link-section {
  text-align: center;
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid #e0e0e0;
}

.link-section p {
  margin: 10px 0;
  font-size: 14px;
}

.link-section a {
  color: #0077ff;
  text-decoration: none;
  font-weight: 600;
}

.link-section a:hover {
  text-decoration: underline;
}

@media (max-width: 480px) {
  .box {
    padding: 30px 20px;
  }

  input {
    font-size: 16px;
  }
}
</style>

</head>

<body>

<div class="container">
  <div class="box">
    <h2>🔐 Login</h2>
    <p>Sign in to your account</p>
    
    <div class="form-group">
      <label for="email">Email Address</label>
      <input 
        type="email" 
        id="email" 
        placeholder="your@email.com"
        autocomplete="email"
        required>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input 
        type="password" 
        id="password" 
        placeholder="Your password"
        autocomplete="current-password"
        required>
    </div>

    <button id="login-btn" onclick="window.login()">Login 🔑</button>

    <div class="link-section">
      <p>Don't have an account?</p>
      <a href="signup.html">Create an account →</a>
    </div>
  </div>
</div>

</body>
</html>
